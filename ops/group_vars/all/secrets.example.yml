# Copy to secrets.yml (GITIGNORED) and fill in for this deployment. NEVER commit the real file.
# This file combines secrets with public-but-instance-specific identity so a fork cannot accidentally
# deploy under another operator's name. Stronger: `ansible-vault encrypt secrets.yml`.
cloudflare_tunnel_token: "CHANGE_ME"          # Cloudflare Zero Trust → Tunnels → token
cloudflare_zone_id: "CHANGE_ME"               # 32-character production Zone ID
cloudflare_rulesets_read_token: "CHANGE_ME"   # permanent one-zone Zone WAF Read token; never store Edit
tailscale_auth_key: "tskey-auth-CHANGE_ME"    # Tailscale admin → Keys (one-off, for first bootstrap)
heartbeat_url: "CHANGE_ME"                    # required HTTPS dead-man's-switch ping URL

# Public at runtime, but local to this operator/deployment. The image contains none of these values.
operator_name: "CHANGE_ME_LEGAL_OPERATOR"
abuse_email: "abuse@example.invalid"
jurisdiction: "CHANGE_ME_JURISDICTION"
security_email: "security@example.invalid"
security_policy_url: "https://example.invalid/CHANGE_ME_SECURITY_POLICY"
public_origin: "https://CHANGE-ME.invalid"
