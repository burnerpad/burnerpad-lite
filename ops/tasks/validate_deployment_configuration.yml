- name: Validate public security_policy_url
  ansible.builtin.assert:
    quiet: true
    that:
      - security_policy_url | default('', true) | length <= 2048
      - (security_policy_url | default('', true) | trim) == (security_policy_url | default('', true))
      - (security_policy_url | default('', true) | ansible.builtin.urlsplit('scheme')) == 'https'
      - security_policy_url | default('', true) | ansible.builtin.urlsplit('hostname') | default('', true) | length > 0
      - security_policy_url | default('', true) | ansible.builtin.urlsplit('username') | default('', true) | length == 0
      - security_policy_url | default('', true) | ansible.builtin.urlsplit('password') | default('', true) | length == 0
      - security_policy_url | default('', true) | ansible.builtin.urlsplit('fragment') | default('', true) | length == 0
      - not ((security_policy_url | default('', true)) is search('[\\x00-\\x20\\x7f]'))
      - not (security_policy_url | default('', true) | ansible.builtin.urlsplit('hostname') | lower).endswith('.invalid')
      - "'CHANGE_ME' not in (security_policy_url | default('', true) | upper)"
      - "'CHANGE-ME' not in (security_policy_url | default('', true) | upper)"
    fail_msg: >-
      security_policy_url is missing or invalid in the gitignored group_vars/all/secrets.yml.

- name: Validate public_origin
  ansible.builtin.assert:
