      - public_origin | default('', true) | ansible.builtin.urlsplit('password') | default('', true) | length == 0
      - public_origin | default('', true) | ansible.builtin.urlsplit('path') | default('', true) | length == 0
      - public_origin | default('', true) | ansible.builtin.urlsplit('query') | default('', true) | length == 0
      - public_origin | default('', true) | ansible.builtin.urlsplit('fragment') | default('', true) | length == 0
      - not ((public_origin | default('', true)) is search('[\\x00-\\x20\\x7f]'))
      - not (public_origin | default('', true) | ansible.builtin.urlsplit('hostname') | lower).endswith('.invalid')
      - "'CHANGE_ME' not in (public_origin | default('', true) | upper)"
      - "'CHANGE-ME' not in (public_origin | default('', true) | upper)"
    fail_msg: >-
      public_origin is missing or invalid in the gitignored group_vars/all/secrets.yml.
