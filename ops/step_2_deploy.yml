---
# STEP 2 — run for the first deploy and EVERY routine application release, over Tailscale:
#     cd ops
#     ansible-playbook step_2_deploy.yml
#
# Verifies and deploys the exact public GHCR artifacts produced for a clean git revision. It intentionally
# does not repeat host setup or OS/SSH hardening.
- name: Step 2 - deploy or redeploy Burnerpad
  hosts: burnerpad
  become: true
  pre_tasks:
    - name: Read release revision from the local full git SHA
      delegate_to: localhost
      become: false
      ansible.builtin.command: git -C "{{ playbook_dir }}/.." rev-parse HEAD
      register: _sha
      changed_when: false

    - name: Refuse to deploy a dirty working tree
      delegate_to: localhost
      become: false
      ansible.builtin.command: git -C "{{ playbook_dir }}/.." status --porcelain
      register: _dirty
      changed_when: false
      failed_when: _dirty.stdout | length > 0

    - name: Use the full git SHA as the image and release revision
      ansible.builtin.set_fact:
        image_tag: "{{ _sha.stdout }}"

    - name: Validate production deployment configuration
      ansible.builtin.import_tasks: tasks/validate_deployment_configuration.yml
  roles:
    - deploy
    - monitor
