# Install once:  cd ops && ./install-requirements-locked.sh
collections:
  # Pin every control-plane dependency: a fresh deploy must run the same reviewed automation, not whatever
  # Galaxy happens to call latest that day. Dependabot does not cover Galaxy, so review bumps deliberately.
  - { name: devsec.hardening,  version: "10.6.0" }  # CIS-grade OS + SSH hardening
  - { name: community.docker,  version: "5.2.2" }   # docker_compose_v2
  - { name: community.general, version: "13.3.0" }  # ufw
  - { name: ansible.posix,     version: "2.2.2" }   # sysctl
  # Pin the full transitive set too: Galaxy otherwise resolves newer archives than our checksum lock.
  - { name: community.crypto, version: "3.3.0" }
  - { name: community.mysql, version: "5.0.2" }
  - { name: ansible.mysql, version: "5.2.0" }
  - { name: community.library_inventory_filtering_v1, version: "1.1.5" }
roles:
  - { name: geerlingguy.docker, version: "8.0.0" }  # install Docker Engine
