# Copy to inventory.ini (GITIGNORED) and fill in.
#
# SETUP play 1: reach the FRESH box by its public IP as root, once. Fresh-host setup removes the exact
# public-IP and tailnet-name entries from known_hosts before `accept-new` pins their replacement keys.
# Routine deployments never remove keys and still refuse a changed key.
[bootstrap]
newbox  ansible_host=YOUR.VPS.PUBLIC.IP  ansible_user=root  ansible_python_interpreter=/usr/bin/python3  ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

# SETUP play 2 + every deployment: connect through Tailscale as deploy. The first setup play creates this
# path; the second play waits for it and stops safely before hardening if it cannot connect.
[burnerpad]
prod    ansible_host=burnerpad  ansible_user=deploy  ansible_python_interpreter=/usr/bin/python3  ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'  # Tailscale MagicDNS name
