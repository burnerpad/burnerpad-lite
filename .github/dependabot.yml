version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /test/browser
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /ops
    schedule: { interval: weekly }
