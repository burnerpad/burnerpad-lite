name: release

# Publish only after every job in the main test workflow succeeds for a same-repository push to main.
# No VPS, Cloudflare, Tailscale, or application secret is available to this workflow.
on:
  workflow_run:
    workflows: [test]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Version selection and tag creation are one serialized transaction. A newer main commit waits for the
  # prior release to record its tag before calculating the next patch.
  group: release
  cancel-in-progress: false

jobs:
  identity:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the automatic patch release
        id: version
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(.github/scripts/next-release-version.sh "$REVISION")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  source:
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Package the exact parent and crypto source revisions
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          dist="$RUNNER_TEMP/source-release"
          tree="$RUNNER_TEMP/source-tree"
          .github/scripts/package-source.sh "$dist" "$REVISION"
          mkdir -p "$tree"
          tar -xzf "$dist/burnerpad-lite-source-$REVISION.tar.gz" -C "$tree"
      - name: Generate the source SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        env:
          SYFT_SOURCE_NAME: burnerpad-lite
          SYFT_SOURCE_VERSION: ${{ github.event.workflow_run.head_sha }}
        with:
          path: ${{ runner.temp }}/source-tree/burnerpad-lite-${{ github.event.workflow_run.head_sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/source-release/burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the source SBOM attestation
        id: source-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/source-release/burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}.tar.gz
          sbom-path: ${{ runner.temp }}/source-release/burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}.spdx.json
      - name: Verify and collect the source release evidence
        env:
          ATTESTATION_BUNDLE: ${{ steps.source-attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          dist="$RUNNER_TEMP/source-release"
          archive="$dist/burnerpad-lite-source-$REVISION.tar.gz"
          cp "$ATTESTATION_BUNDLE" "$dist/burnerpad-lite-source-$REVISION.attestation.json"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --deny-self-hosted-runners
          (cd "$dist" && sha256sum -- * > SHA256SUMS)
      - name: Archive the source release, SPDX SBOM, and attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/source-release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    needs: [identity, source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - suffix: ''
            dockerfile: Dockerfile
            version: app
          - suffix: '-cloudflared'
            dockerfile: ops/cloudflared.Dockerfile
            version: tunnel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Resolve immutable release identity
        id: identity
        env:
          APP_VERSION: ${{ needs.identity.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          if [ -z "$SUFFIX" ]; then
            component_version=$APP_VERSION
          else
            component_version=$(sed -n 's/^ARG CLOUDFLARED_VERSION=//p' ops/cloudflared.Dockerfile)
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$REVISION" >> "$GITHUB_OUTPUT"
          echo "version=$component_version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and publish ${{ matrix.version }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
          build-args: |
            BURNERPAD_REVISION=${{ github.event.workflow_run.head_sha }}
            BURNERPAD_VERSION=${{ steps.identity.outputs.version }}
          provenance: mode=max
          sbom: true
      # The SHA tag is discovery only. Approval is bound to the immutable registry digest returned by
      # this exact build; the same digest is scanned, attested, signed, and later verified by Ansible.
      - name: Pull the exact published digest for scanning
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"
      - name: Scan the exact published digest for high and critical vulnerabilities
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --no-progress --skip-version-check "$IMAGE@$DIGEST"
      - name: Record the passed vulnerability policy for the exact digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PREDICATE_PATH: ${{ runner.temp }}/trivy-scan-predicate.json
        run: |
          jq -n --arg digest "$DIGEST" '{
            scanner: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969",
            image_digest: $digest,
            scanners: ["vuln"],
            rejected_severities: ["HIGH", "CRITICAL"],
            result: "passed"
          }' > "$PREDICATE_PATH"
      - name: Attach the passed vulnerability-scan attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://burnerpad.io/attestations/trivy/v1
          predicate-path: ${{ runner.temp }}/trivy-scan-predicate.json
          push-to-registry: true
      - name: Attach GitHub build-provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the just-published vulnerability-scan attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          gh attestation verify "oci://$IMAGE@$DIGEST"
          --repo "$GITHUB_REPOSITORY"
          --predicate-type https://burnerpad.io/attestations/trivy/v1
      - name: Add a keyless Sigstore signature
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the just-published signature
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify
          --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "$IMAGE@$DIGEST"
      - name: Promote the approved digest to the main alias without rebuilding
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROMOTION_METADATA: ${{ runner.temp }}/main-promotion.json
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" \
            --metadata-file "$PROMOTION_METADATA" "$IMAGE@$DIGEST"
          promoted_digest=$(jq -r '."containerimage.descriptor".digest' "$PROMOTION_METADATA")
          test "$promoted_digest" = "$DIGEST"

  record:
    needs: [identity, source, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Create the immutable release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          tag="v$VERSION"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "burnerpad-lite-source-$REVISION" --dir "$assets"

          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null); then
            ref_type=$(jq -r '.object.type' <<< "$ref")
            ref_sha=$(jq -r '.object.sha' <<< "$ref")
            if [ "$ref_type" = tag ]; then
              ref_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" --jq '.object.sha')
            fi
            test "$ref_sha" = "$REVISION" || {
              echo "::error::$tag already names a different revision"
              exit 1
            }
          else
            tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" -f message="Burnerpad $tag" -f object="$REVISION" -f type=commit \
              --jq .sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$tag_object" >/dev/null
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published"
          else
            gh release create "$tag" "$assets"/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Burnerpad $tag" --generate-notes
          fi
