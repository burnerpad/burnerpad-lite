name: release

# Publish only after every job in the main test workflow succeeds for a same-repository push to main.
# No VPS, Cloudflare, Tailscale, or application secret is available to this workflow.
on:
  workflow_run:
    workflows: [test]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Package the exact parent and crypto source revisions
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          dist="$RUNNER_TEMP/source-release"
          tree="$RUNNER_TEMP/source-tree"
          .github/scripts/package-source.sh "$dist" "$REVISION"
          mkdir -p "$tree"
          tar -xzf "$dist/burnerpad-lite-source-$REVISION.tar.gz" -C "$tree"
      - name: Generate the source SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: burnerpad-lite
          SYFT_SOURCE_VERSION: ${{ github.event.workflow_run.head_sha }}
        with:
          path: ${{ runner.temp }}/source-tree/burnerpad-lite-${{ github.event.workflow_run.head_sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/source-release/burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the source SBOM attestation
        id: source-attestation
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/source-release/burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}.tar.gz
          sbom-path: ${{ runner.temp }}/source-release/burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}.spdx.json
      - name: Verify and collect the source release evidence
        env:
          ATTESTATION_BUNDLE: ${{ steps.source-attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          dist="$RUNNER_TEMP/source-release"
          archive="$dist/burnerpad-lite-source-$REVISION.tar.gz"
          cp "$ATTESTATION_BUNDLE" "$dist/burnerpad-lite-source-$REVISION.attestation.json"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          (cd "$dist" && sha256sum -- * > SHA256SUMS)
      - name: Archive the source release, SPDX SBOM, and attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burnerpad-lite-source-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/source-release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    needs: source
    if: needs.source.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - suffix: ''
            dockerfile: Dockerfile
            version: app
          - suffix: '-cloudflared'
            dockerfile: ops/cloudflared.Dockerfile
            version: tunnel
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Resolve immutable release identity
        id: identity
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          app_version=$(tr -d '\n' < VERSION)
          printf '%s\n' "$app_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::VERSION must contain an X.Y.Z semantic application version"
            exit 1
          }
          if [ -z "$SUFFIX" ]; then
            component_version=$app_version
          else
            component_version=$(sed -n 's/^ARG CLOUDFLARED_VERSION=//p' ops/cloudflared.Dockerfile)
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$REVISION" >> "$GITHUB_OUTPUT"
          echo "version=$component_version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build and publish ${{ matrix.version }} image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
          build-args: |
            BURNERPAD_REVISION=${{ github.event.workflow_run.head_sha }}
            BURNERPAD_VERSION=${{ steps.identity.outputs.version }}
          provenance: mode=max
          sbom: true
      # The SHA tag is discovery only. Approval is bound to the immutable registry digest returned by
      # this exact build; the same digest is scanned, attested, signed, and later verified by Ansible.
      - name: Pull the exact published digest for scanning
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"
      - name: Scan the exact published digest for high and critical vulnerabilities
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --no-progress --skip-version-check "$IMAGE@$DIGEST"
      - name: Record the passed vulnerability policy for the exact digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PREDICATE_PATH: ${{ runner.temp }}/trivy-scan-predicate.json
        run: |
          jq -n --arg digest "$DIGEST" '{
            scanner: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969",
            image_digest: $digest,
            scanners: ["vuln"],
            rejected_severities: ["HIGH", "CRITICAL"],
            result: "passed"
          }' > "$PREDICATE_PATH"
      - name: Attach the passed vulnerability-scan attestation
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://burnerpad.io/attestations/trivy/v1
          predicate-path: ${{ runner.temp }}/trivy-scan-predicate.json
          push-to-registry: true
      - name: Attach GitHub build-provenance attestation
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the just-published vulnerability-scan attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          gh attestation verify "oci://$IMAGE@$DIGEST"
          --repo "$GITHUB_REPOSITORY"
          --predicate-type https://burnerpad.io/attestations/trivy/v1
      - name: Add a keyless Sigstore signature
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify the just-published signature
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify
          --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          "$IMAGE@$DIGEST"
      - name: Promote the approved digest to the main alias without rebuilding
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROMOTION_METADATA: ${{ runner.temp }}/main-promotion.json
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" \
            --metadata-file "$PROMOTION_METADATA" "$IMAGE@$DIGEST"
          promoted_digest=$(jq -r '."containerimage.descriptor".digest' "$PROMOTION_METADATA")
          test "$promoted_digest" = "$DIGEST"
