---
- name: Exercise the production runtime-credential artifact boundary
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    remote_dir: "{{ lookup('ansible.builtin.env', 'BURNERPAD_RUNTIME_TEST_DIR') }}"
    deploy_user: "{{ lookup('ansible.builtin.env', 'BURNERPAD_RUNTIME_TEST_OWNER') }}"
    app_image: "example.invalid/burnerpad@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    cloudflared_image: "example.invalid/cloudflared@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    operator_name: "CI operator"
    abuse_email: "abuse@example.com"
    jurisdiction: "CI"
    security_email: "security@example.com"
    security_policy_url: "https://example.com/security"
    max_secrets: 10000
    global_create_ceiling: 1000
    per_ip_budget: 13107200
    per_ip_row_budget: 200
  tasks:
    - name: Render one production runtime-credential artifact
      ansible.builtin.include_role:
        name: deploy
        tasks_from: runtime_credentials
